<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Layout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Layout.css" />
</head>

<body>
    <div class="container">
        <!--Header-->
        <header id="myheader">
            <div>FIT-HCMUE Shop</div>
            <div>Shopping together</div>
            <img class="hh-img" src="images/header-object.png" alt="HCMUE" />
        </header>

        <!-- Menu ngang-->
        <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">HCMUE</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavbar">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="collapsibleNavbar">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" href="#">Trang chủ</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Giới thiệu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Liên hệ</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">Danh
                                mục</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Máy tính bảng</a></li>
                                <li><a class="dropdown-item" href="#">Điện thoại</a></li>
                                <li><a class="dropdown-item" href="#">Laptop</a></li>
                            </ul>
                        </li>
                    </ul>
                    <form class="d-flex">
                        <input class="form-control me-2" type="text" placeholder="Search">
                        <button class="btn btn-primary" type="button">Search</button>
                    </form>
                    <ul class="navbar-nav ml-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="#">English</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Tiếng Việt</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- /Menu ngang-->

        <!--Content-->
        <div class="row m-0">
            <div class="col-lg-9 hh-content row">
                #PRODUCT
                <div class="card hh-product col-md-4">
                    <div class="card-header">IPhone 19</div>
                    <div class="card-body">
                        <img src="images/iphone14.png" alt="ÍP4" />
                    </div>
                    <div class="card-footer">19,000,000 đ</div>
                </div>
                <div class="card hh-product col-md-4">
                    <div class="card-header">IPhone 19</div>
                    <div class="card-body">
                        <img src="images/iphone14.png" alt="ÍP4" />
                    </div>
                    <div class="card-footer">19,000,000 đ</div>
                </div>
            </div>
            <aside class="col-lg-3 hh-content">
                <!--Giỏ hàng-->
                <div class="card mt-1">
                    <div class="card-header">Giỏ hàng</div>
                    <div class="card-body">Content</div>
                </div>

                <!--Loại-->
                <div class="card mt-1">
                    <div class="card-header">Danh mục</div>
                    <div class="card-body">
                        <ul class="list-group m-0">
                            <li class="list-group-item m-0">Phone</li>
                            <li class="list-group-item">Tablet</li>
                            <li class="list-group-item">Laptop</li>
                        </ul>
                    </div>
                </div>
            </aside>
        </div>
        <!--/Content-->

        <!--Footer-->
        <!--/Footer-->
    </div>
</body>

</html>
