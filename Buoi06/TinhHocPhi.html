<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container">
        <form>
            <h2>Tính học phí</h2>
            <div class="mb-3 mt-3">
                <label for="hoten" class="form-label">Họ tên:</label>
                <input type="text" class="form-control" id="hoten" placeholder="Nhập họ tên" name="hoten">
            </div>
            <div class="mb-3">
                <label for="gioitinh" class="form-label">Giới tính:</label>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="radio1" name="gioitinh" value="0" checked>Nam
                    <label class="form-check-label" for="radio1"></label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" id="radio2" name="gioitinh" value="1">Nữ
                    <label class="form-check-label" for="radio2"></label>
                </div>
            </div>
            <div class="mb-3 mt-3">
                <label for="sotc" class="form-label">Số tín chỉ:</label>
                <input type="number" class="form-control" id="sotc" placeholder="Nhập số tín chỉ" name="hoten">
            </div>
            <button type="button" onclick="tinhHocPhi()" class="btn btn-primary">Tính học phí</button>
        </form>
        <div id="ketqua"></div>
    </div>
    <script>
        function tinhHocPhi() {
            let hoTenEle = document.getElementById("hoten");
            if (hoTenEle !== null && hoTenEle.value.trim().length === 0) {
                alert("Vui lòng nhập tên");
                hoTenEle.focus();
                return;
            }
            let soTcEle = document.getElementById("sotc");
            if(soTcEle !== null && (soTcEle.value.trim().length == 0 || parseInt(soTcEle.value) < 1)){
                alert("Số tín chỉ không hợp lệ");
                soTcEle.focus();
                return;
            }
            let sotc = parseInt(soTcEle.value);
            let chuoi = `SV ${hoTenEle}, học ${sotc} TC, HP=${sotc*460000}`;
            document.getElementById("ketqua").innerHTML = chuoi;
        }
    </script>
</body>

</html>
